    <script>
      const API_URL_RM = 'https://rickandmortyapi.com/api/character';
      const API_URL_HP = 'https://hp-api.onrender.com/api/characters';

      const main = document.getElementById('main');

      const form = document.getElementById('form');
      const search = document.getElementById('search');

        // APIs mezclados
        getPersonajes();
        //se le llama a la función que obtine todos los personajes
        //de ambas APIs cuando carga por primera vez la pag.
            async function getPersonajes() {
            const [resRM, resHP] = await Promise.all([
            fetch(API_URL_RM).then(res => res.json()),
            fetch(API_URL_HP).then(res => res.json())
            ]);

            //la función async se pone pq se va usar await.
            //se muestra un msj mientras se cargan los personajes.
            //Se hacen ambas peticiones en paralelo con Promise.all.
            //las respuestas se vuelven formato JSON 
            //await hace que JavaScript espere el resultado de Promise.all(...)
            //ates de continuar con el resto de código.
            //Es decir, detiene la ejecución hasta que las respuestas esten listas.

              const rm = resRM.results || [];
              const hp = resHP || [];
              //Se guardan los arrays de persnajes.
              //RyM usa results, HP devuelve un array direcamente.

              showPersonajes([...rm, ...hp]);
              }
              //se llama a showcharacters para mostrar todos los personajes juntos.

              function showPersonajes(personajes) {
              main.innerHTML = '';

              
              personajes.forEach((persona) => {
                    let name = persona.name || 'Desconocido';
                    let gender = persona.gender || 'No especificado';
                    let species = persona.species || 'Desconocida';
                    let image = persona.image || '';
					let status = persona.status || (persona.alive === false ? 'Deceased' : 'Alive');

                    const personaElement = document.createElement('div');
                    personaElement.classList.add('personaje');
                //esto sirve para identificar de quien es la busqueda, si de RyM o HP
                //si el "personaje" tiene como estado vivo o muerto pertenece a RyM, pues 
                //HP no tiene esatdo, solo casa, nombre, actor y género. Mientras que RyM
                //tiene estado (vivo o muerto) Nombre, id y especie **(solo los que aparecen en descripción)**
                    if (persona.status) { //  Si "persona" tiene "estado"
                      let id = persona.id;  //etonces poner id. persona. id
                      let status = persona.status; // poner persona. estado status

                      personaElement.innerHTML = `
                        <img src="${image}" alt="${name}">

                        <div class="personaje-info">
                          <h1>${id}</h1>
                          <h3>${name}</h3>
                          <br>${gender}
                        </div>

                        <div class="overview">
                          <h3>Descripción</h3>
                          <p><strong>Estado:</strong> ${status}</p>
                          <p><strong>Especie:</strong> ${species}</p>
                        </div>`;

                   } else { //entoces poner

                          // Harry Potter
                          const { house, actor } = persona; //Extrae los datos de house y actor de la variable persona y las asigna a variables nuevas con el mismo nombre.

                          personaElement.innerHTML = `
                          <img src="${image}" alt="${name}">

                          <div class="personaje-info">
                          <h3>${name}</h3>
                          <br>${actor}
                          </div>

                          <div class="overview">
                          <h3>Descripción</h3>
                          <p><strong>Casa:</strong> ${house || 'Desconocida'}</p>
                          <p><strong>Género:</strong> ${gender}</p>
                          <p><strong>Especie:</strong> ${species}</p>
                          </div>
                          `;}

                          main.appendChild(personaElement);
                          })}

					//buscar los personajes
                    form.addEventListener('submit', (e) =>{
                    e.preventDefault()
                    const searchTerm = search.value.toLowerCase();
                    if(searchTerm && searchTerm !== ''){
                        getPersonajes(API_URL_RM + `?name=${searchTerm}`)
						getPersonajes(API_URL_HP + `?name=${searchTerm}`)
                        search.value='';
                    }else{
                        window.location.reload();
                    }
                })   
      </script>
