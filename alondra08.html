<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        @import url('https://fonts.cdnfonts.com/css/oxygen');
        @import url('https://fonts.cdnfonts.com/css/poppins');
        *{
            box-sizing: border-box;
        }
        :root{
            --primary-color: #9b2226 ;
            --secundary-color: #ae2012;
            --terceary-color: #bb3e03;
            --color-cuarto: #ca6702;
            --color-quinto: #e2d7b2;
        }
        body{
            background-color: var(--color-quinto);
            font-family: 'Oxygen', sans-serif;                 
            margin: 0;
        }
        header{
            padding: 16px;
            display: flex;
            justify-content: flex-end;
            background-color: var(--color-cuarto);
        }
        .search{
            background-color: white;
            border: 5px solid var(--primary-color);
            border-radius:50px;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            padding: 20px 16px;
            color: black;
        }
        .search::placeholder{
            color: black;
        }
        .search:focus{
            outline: none;
            background-color: white;
        }
        main{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .personaje{
            width: 400;
            margin:15px;
            background-color: var(--color-quinto);
            box-shadow: 10 4px 5px black;
            position:relative;
            overflow: hidden;
            border-radius: 5;
            display:flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }
        .personaje img{
            width: 100%;
            height: 400px;
            object-fit: contain;
        }
        .personaje-info{
            color: black;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 0.8px 15px 15px;
            letter-spacing: 5px;
        }
        .personaje-info h3{
            color: var(--terceary-color);
            margin-top: 0;
        }
        .personaje-info h1{
            color: var(--terceary-color);
            margin-top: 0;
        }
        .overview{
            background-color: var(--color-quinto);
            padding:15px;
            position: absolute;
            left: 0;
            bottom: 0;
            right: 0;
            max-height: 100%;
            transform: translateY(101%);
            overflow-y: auto;
            transition: transform 0.3s ease-in;
        }
        .personaje:hover .overview{
            transform: translateY(0);
        }
    </style>


    <header> 
        <form id="form">
        <img src="logo4.png" alt="logo" class="logo" style="width: 200px; height:100px; margin-right: 10px;">
        <input type="text" id="search" class="search" placeholder="Busca tu ..."></form>  
    </header>
        <main id="main"></main>


    <script>
        const API_URL = 'https://dragonball-api.com/api/characters';

        const main = document.getElementById('main');
        const form = document.getElementById('form');  
        const search = document.getElementById('search');

        getCharacters(API_URL)

        async function getCharacters(url){
            const res = await fetch(url);
            const data = await res.json();
            showCharacters(data.items || data);
        } 
        function showCharacters(characters){
            main.innerHTML = '';

            characters.forEach((char)=>{
                //en esta linea se pondra todos los elementos al principio para el 
                //forEach, es similar al "for", pero el for tiene su inicialización,
                //condición y limitante
                const{id, name, image, ki, maxKi, race, gender, description} = char;
                //aqui se pone lo que nos va interesar del API que vamos obtener
                const charElement = document.createElement('div');
                charElement.classList.add('personaje');
                charElement.innerHTML = `
                <img src="${image}" alt="${image}">
                <div class="personaje-info">
                    <h1>${id}</h1>
                    <h3>${name}</h3>
                   <br>
                   ${race}
                        </div>
                        <div class="overview">
                            <h3>Descripcion</h3>
                            <p><strong>Ki:</strong> ${ki}</p>
                            <p><strong>MaxKi:</strong> ${maxki}</p>
                            ${description}
                            </div>`
                    main.appendChild(charElement);
            })}
                form.addEventListener('submit', (e) =>{
                    e.preventDefault()
                    const searchTerm = search.value.toLowerCase();
                    if(searchTerm && searchTerm !== ''){
                        getCharacters(API_URL + `?name=${searchTerm}`)
                        search.value='';
                    }else{
                        window.location.reload();
                    }
                })
        </script>
    
</body>
</html>
