<body>
    <style>
        @import url('https://fonts.cdnfonts.com/css/poppins');

    <input type="text" placeholder="pokemon" id="pokeName"
    class="placeholder">

    <img src="pokebola1.png" alt="Pokeball" id="pokeImg" width="300px"
    class="pokeImg">

        <div id="pokename" class="pokeImg1" style="top: 200px; left:90px;"> Nombre</div>
        <div id="pokehe" class="pokeImg1" style="top: 240px; left:90px;"> Altura:</div>
        <div id="pokewe" class="pokeImg1" style="top: 280px; left:90px;"> Peso:</div>
        <div id="poketype" class="pokeImg1" style="top: 320px; left:90px;"> Tipo:</div>
        <div id="pokeitem" class="pokeImg1" style="top: 360px; left:90px;"> Habilidad:</div>

        <div id="pokemove1" class="pokeImg1" style="top: 400px; left:90px;"> Movimiento #1:</div>
        <div id="pokemove2" class="pokeImg1" style="top: 440px; left:90px;"> Movimiento #2:</div>
        <div id="pokemove3" class="pokeImg1" style="top: 480px; left:90px;"> Movimiento #3:</div>
        <div id="pokemove4" class="pokeImg1" style="top: 520px; left:90px;">Movimiento #4:</div>
        
        <div id="pokeid" class="pokeImg1" style="top: 580px; left:90px;"></div>
        <div id="pokeorder" class="pokeImg1" style="top: 620px; left:90px;"></div>

    <button onclick="fetchPokemon()" class="buttom"></button>

    <div class="grafica">
        <canvas id="miCanvas"></canvas>
    </div>

    <script>
        const fetchPokemon = () =>{
            const pokeNameInput = document.getElementById("pokeName");
            let pokeName = pokeNameInput.value;
            pokeName = pokeName.toLowerCase();
            const url = `https://pokeapi.co/api/v2/pokemon/${pokeName}`;

            fetch(url).then((res) =>{
                if(res.status != "200"){
                    console.log(res);
                }else{
                    return res.json();
                }
            }).then((data) => {
                if(data){
                    console.log(data);

                    let pokeImg = data.sprites.front_default;
                    pokeImage(pokeImg);

                    let name = document.getElementById('pokename');
                    name.innerHTML=`Nombre: ${data.forms[0].name}`;

                    let element1=document.getElementById('pokehe');
                    element1.innerHTML=`Altura: ${data.height}`;

                    let element2=document.getElementById('pokewe');
                    element2.innerHTML=`Peso: ${data.weight}`;

                    let element3=document.getElementById('pokeorder');
                    element3.innerHTML=`Order: #${data.order}`;
                    
                    let element4=document.getElementById('pokeid');
                    element4.innerHTML=`Id: #${data.id}`;

                    let element5=document.getElementById('pokeitem');
                    element5.innerHTML=`Ability: ${data.abilities[0].ability.name}`;

                    let element6=document.getElementById('poketype');
                    element6.innerHTML=`Tipo: ${data.types[0].type.name}`;
                    
                    let element7=document.getElementById('pokemove1');
                    element7.innerHTML=`Movimiento #1: ${data.moves[0].move.name}`;

                    let element8=document.getElementById('pokemove2');
                    element8.innerHTML=` Movimiento #2: ${data.moves[1].move.name}`;

                    let element9=document.getElementById('pokemove3');
                    element9.innerHTML=`Movimiento #3: ${data.moves[2].move.name}`;

                    let element10=document.getElementById('pokemove4');
                    element10.innerHTML=`Movimiento #4: ${data.moves[3].move.name}`;
                    
                    const miCanvas=document.getElementById("miCanvas").getContext("2d");

                    if(window.miCanva != undefined)
                    window.miCanva.destroy();
                    window.miCanva=new Chart (miCanvas, {
                        type: "bar",
                        data: {
                            labels:["HP", "Attack", "Denfense", "Special-A", "Special-D","Speed"],
                            
                            datasets: [
                        {
                            label: `${data.form[0].name}`,
                            backgroundColor:'rgba(154,62,35,1',

                            data:[`$data.stats[0].base_stat}`,
                            `$data.stats[1].base_stat}`,
                            `$data.stats[2].base_stat}`,
                            `$data.stats[3].base_stat}`,
                            `$data.stats[4].base_stat}`,
                            `$data.stats[5].base_stat}`],

                            borderColor:[
                                'rgba(255,99, 132, 1)',
                                'rgba(54,162, 235, 1)',
                                'rgba(355,206, 86, 1)',
                                'rgba(75,192, 192, 1)',
                                'rgba(153,102, 255, 1)',
                                'rgba(255,159, 64, 1)'],

                            backgroundColor: [
                                'rgba(255,99, 132, 0.5)',
                                'rgba(54,162, 235, 0.5)',
                                'rgba(355,206, 86, 0.5)',
                                'rgba(75,192, 192, 0.5)',
                                'rgba(153,102, 255, 0.5)',
                                'rgba(255,159, 64, 0.5)'
                            ], borderWidth: 1,
                        }]},
                        options: {
                            scales: {
                                x:{ 
                                    ticks: {
                                        maxRotation:90,
                                        minRotation: 90,
                                        color:'puple',
                                        font:{size: 15},
                                    }  }}}
                            })} });
        const pokeImage = (url) => {
            const pokePhoto = document.getElementById("pokeImg");
            pokePhoto.src = url;
        }}
    </script>
